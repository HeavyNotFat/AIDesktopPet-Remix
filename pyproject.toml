[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-desktop-pet-remix"
version = "1.0.0"
description = "AI 桌宠（Live2D / Emote / 静态形象 + 本地或云端 LLM + 网页聊天）"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "HeavyNotFat" }]
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
]

[tool.setuptools]
py-modules = ["core", "main"]

[tool.setuptools.packages.find]
include = ["stlibs*", "shader*", "mcp_servers*", "tools*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", ".git", "build", "dist", ".PluginDevOld"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "C4", "SIM"]
ignore = [
    "E501",   # 行宽交给 line-length
    "B008",   # Qt 里 QTimer.singleShot(...) 这类默认值是常见的
    "SIM108", # 三元表达式不强制
    "UP038",  # isinstance 元组写法在 Qt 类型上更直观
]

[tool.ruff.lint.per-file-ignores]
# 主题包的 __init__ 是契约门面：只做重新导出 + 映射别名，本来就"用不到"那些名字
"stlibs/themes/*/__init__.py" = ["E402", "F401", "I001"]
"stlibs/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "preserve"
