name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  quality:
    name: UI & 架构门禁
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 运行 tools/ci（无第三方依赖）
        run: python -m tools.ci --no-color --format markdown --output ci-report.md

      - name: 控制台摘要
        if: always()
        run: python -m tools.ci --no-color --format text --max-findings 50 || true

      - name: 生成 SARIF
        if: always()
        run: python -m tools.ci --format sarif --output ci.sarif || true

      - name: 写入 Job Summary
        if: always()
        run: cat ci-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: ci.sarif
          category: adpci

      - name: 上传门禁报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adpci-report
          path: |
            ci-report.md
            ci.sarif
          if-no-files-found: warn

  lint:
    name: 静态检查 (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装 ruff
        run: python -m pip install "ruff==0.6.9"

      - name: ruff 语法级检查（阻断）
        run: ruff check --select E9 --output-format=github .

      - name: ruff 完整规则（仅报告，不阻断）
        continue-on-error: true
        run: |
          echo "### ruff 完整规则（建议项）" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> " $ GITHUB_STEP_SUMMARY"
          ruff check --statistics . >> " $ GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ruff check --output-format=github .

      - name: ruff format --check
        continue-on-error: true
        run: ruff format --check .

  compile:
    name: 编译检查
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: compileall（排除 .venv / 历史目录）
        shell: bash
        run: |
          python - <<'PY'
          import compileall, sys
          ok = compileall.compile_dir(
              ".",
              quiet=1,
              rx=__import__("re").compile(r"(\.venv|\.git|\.idea|\.PluginDevOld|__pycache__|build|dist)"),
          )
          sys.exit(0 if ok else 1)
          PY

  tests:
    name: 测试 (py${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-qt

      - name: 跑 pytest
        run: python -m pytest tests -q --junitxml=junit.xml

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: junit.xml
          if-no-files-found: warn

  web:
    name: 网页端语法检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: node --check 每个 js 文件
        run: |
          set -e
          fail=0
          while IFS= read -r file; do
            echo "checking $file"
            node --check "$file" || fail=1
          done < <(find resources/web -name '*.js' -type f)
          exit $fail

  package:
    name: 打包冒烟
    if: github.event_name != 'pull_request'
    needs: [quality, lint, compile, tests, web]
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: PyInstaller 打包（onedir）
        run: >
          python -m PyInstaller
          --noconfirm --clean --windowed --onedir
          --name "AI Desktop Pet"
          --icon logo.ico
          --version-file file_version_info.txt
          --add-data "resources;resources"
          --add-data "logo.ico;."
          --collect-all live2d
          --collect-all PySide6
          main.py

      - name: 冒烟：产物结构检查
        shell: pwsh
        run: |
          $exe = "dist/AI Desktop Pet/AI Desktop Pet.exe"
          if (-not (Test-Path $exe)) { throw "打包产物缺失：$exe" }
          $res = "dist/AI Desktop Pet/_internal/resources"
          if (-not (Test-Path $res)) { throw "resources 没有被收进包：$res" }
          foreach ($item in @("web/onlinechat/index.html", "configure.json", "static.json", "fonts/jetbrains.ttf")) {
            if (-not (Test-Path (Join-Path $res $item))) { throw "缺少资源：$item" }
          }
          Write-Host "打包产物检查通过"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: AI-Desktop-Pet-${{ github.sha }}
          path: dist/AI Desktop Pet
          retention-days: 14
