name: Release

# 打 tag（v1.2.3）时：先过一遍完整门禁，再打包并发布 Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '要打包的版本号（仅用于产物命名，例如 v1.0.0）'
        required: false
        default: 'v0.0.0-dev'

permissions:
  contents: write

jobs:
  # 发布前必须先过门禁：UI 冲突 / 抽象契约 / 主题映射有问题就不许发版
  gate:
    name: 发布前门禁
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest "fastapi==0.142.2" "pydantic==2.13.4" "uvicorn==0.54.0" "httpx==0.28.1"
      - name: tools/ci
        run: python -m tools.ci --no-color
      - name: pytest
        run: python -m pytest tests -q
      - name: 报告
        if: always()
        run: python -m tools.ci --format markdown --output ci-report.md || true
      - if: always()
        run: cat ci-report.md >> "$GITHUB_STEP_SUMMARY"

  build:
    name: 打包 Windows 产物
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pyinstaller

      - name: 跑测试
        run: python -m pytest tests -q

      - name: PyInstaller
        run: >
          pyinstaller
          --noconfirm --clean --windowed --onedir
          --name "AI Desktop Pet"
          --icon logo.ico
          --version-file file_version_info.txt
          --add-data "resources;resources"
          --add-data "logo.ico;."
          --collect-all live2d
          --collect-all PySide6
          main.py

      - name: 校验产物
        shell: pwsh
        run: |
          $exe = "dist/AI Desktop Pet/AI Desktop Pet.exe"
          if (-not (Test-Path $exe)) { throw "缺少可执行文件：$exe" }
          $res = "dist/AI Desktop Pet/_internal/resources"
          if (-not (Test-Path $res)) { throw "resources 没有被收集" }
          Write-Host "OK"

      - name: 压缩
        shell: pwsh
        run: |
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { '${{ inputs.version }}' }
          Compress-Archive -Path "dist/AI Desktop Pet/*" -DestinationPath "AI-Desktop-Pet-$tag-win64.zip" -Force

      - name: 上传工作流产物
        uses: actions/upload-artifact@v4
        with:
          name: AI-Desktop-Pet-win64-${{ github.ref_name }}
          path: AI-Desktop-Pet-*.zip
          retention-days: 30

      - name: 创建 Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: AI-Desktop-Pet-*.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
